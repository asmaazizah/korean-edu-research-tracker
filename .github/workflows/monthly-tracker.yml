name: Monthly Korean Education Research Tracker

on:
  schedule:
    # Run at 03:00 UTC on the first day of every month.
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
      WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
      KCI_API_KEY: ${{ secrets.KCI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python -m research_tracker.cli --output-dir reports

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: korean-education-research-report
          path: reports/*.xlsx
          if-no-files-found: error
